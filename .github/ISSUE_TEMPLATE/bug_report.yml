name: 问题反馈
description: 程序出错，或结果和预期不一致
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **请不要上传账号、密码、令牌、Cookie、私人书目或漫画文件。** 截图请遮挡私人内容。安全问题请按[安全策略](https://github.com/gouluanjiang/JMPicaComic-Desktop/blob/main/SECURITY.md)私下提交。
  - type: input
    id: version
    attributes:
      label: 程序版本和提交号
      description: 在“设置 → 网络与诊断”查看
      placeholder: 1.1.0 (abc1234)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 发生在哪里
      multiple: true
      options:
        - JM
        - 哔咔
        - 电脑漫画库
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      placeholder: |
        1. 打开“作者更新”
        2. 点击“一键检查全部关注作者”
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有错误提示，请附上原文
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 能重复出现吗
      options:
        - 每次都会
        - 有时会
        - 只出现过一次
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 状态摘要
      description: 在“设置 → 网络与诊断”复制。摘要不含账号、作品标题和私人路径。
      render: text
