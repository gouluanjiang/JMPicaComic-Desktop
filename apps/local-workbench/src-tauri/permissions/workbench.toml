[[permission]]
identifier = "workbench-documents"
description = "Read and update workbench documents, or choose one background with the native picker."
commands.allow = [
  "read_preferences",
  "history_read",
  "browsing_markers_read",
  "browsing_markers_write",
  "history_record",
  "history_clear",
  "history_set_enabled",
  "write_preferences",
  "read_booklists",
  "write_booklists",
  "choose_background",
  "workbench_info",
  "source_network_health",
]

[[permission]]
identifier = "workbench-updates"
description = "Check the signed release manifest and, for the exact version the user confirmed, install it while no download is running. No renderer URLs, paths or updater plugin commands."
commands.allow = ["workbench_update_check", "workbench_update_install"]

[[permission]]
identifier = "workbench-asmr"
description = "Read the ASMR catalog: listings, search, circles, voice actors, tags, work details, file trees, covers as data URLs and subtitle text by file id. Audio and video stream through the main-window-only media protocol. Sign in to and out of the listener account and read its marked works and playlists; the session token stays native and only the account name is returned. No media URLs, downloads or paths."
commands.allow = ["asmr_works", "asmr_popular", "asmr_search", "asmr_related", "asmr_index", "asmr_work", "asmr_cover", "asmr_subtitle", "asmr_account", "asmr_login", "asmr_logout", "asmr_reviews", "asmr_playlists", "asmr_playlist_works", "asmr_lyrics_open", "asmr_lyrics_hide", "asmr_lyrics_close", "asmr_lyrics_line"]

[[permission]]
identifier = "workbench-asmr-lyrics"
description = "The desktop subtitle window: read the latest subtitle line and close itself. No catalog, media, accounts or paths."
commands.allow = ["asmr_lyrics_current", "asmr_lyrics_close"]

[[permission]]
identifier = "workbench-accounts"
description = "Use native source sessions for metadata, favorites, covers and account-scoped local following."
commands.allow = [
  "source_accounts",
  "source_login",
  "source_logout",
  "source_query",
  "source_author_policy",
  "source_recent_history",
  "source_author_known_works",
  "source_rank_options",
  "source_catalog",
  "source_favorite",
  "source_cover",
  "source_following",
  "source_follow",
  "discovery_read",
  "discovery_progress",
  "discovery_start",
  "special_read",
  "special_set",
  "special_mark_read",
  "special_progress",
  "special_start",
  "special_cancel",
  "discovery_start_unfinished",
  "discovery_cancel",
  "recent_check_start",
  "recent_check_progress",
  "recent_check_cancel",
]

[[permission]]
identifier = "workbench-downloads"
description = "Prepare and explicitly confirm JM/Pica downloads into a selected PC library, control the queue and organize completed history. No renderer paths or media URLs."
commands.allow = ["jm_download_prepare", "jm_download_confirm", "jm_download_read", "download_inventory_read", "jm_download_control", "jm_download_batch_prepare", "jm_download_batch_confirm", "jm_download_selection_confirm", "jm_download_batch_cancel", "jm_download_pause_all", "jm_download_resume_many", "jm_download_history_remove", "jm_download_root_verify"]

[[permission]]
identifier = "workbench-library"
description = "Read the native-picked comic library and its index; explicitly confirmed ZIP/CBZ recycle uses verified identities and Windows Recycle Bin only, never permanent deletion."
commands.allow = ["library_read", "library_choose", "library_import_paths", "library_scan", "library_cover", "library_reveal", "library_recycle"]

[[permission]]
identifier = "workbench-reader"
description = "Read selected indexed ZIP or authenticated source pages and save reading coordinates. No generic path, URL, download or inventory mutation."
commands.allow = ["reader_open", "reader_cancel_open", "reader_chapter", "reader_page", "reader_save_position", "reader_close", "reader_fullscreen"]

[[permission]]
identifier = "workbench-reader-host"
description = "Open a native-bound small reader and coordinate the main window close handshake."
commands.allow = ["reader_window_open", "reader_main_ready", "reader_main_close"]

[[permission]]
identifier = "workbench-reader-child"
description = "Operate only the calling registered reader window and hand a validated online book to main download preparation."
commands.allow = ["reader_window_context", "reader_window_pin", "reader_window_show_main", "reader_window_download", "reader_window_close"]
